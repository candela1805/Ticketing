<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Ticketing</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="Register.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="logo-container">
      <img src="Ticket.icon.png" class="logo-icon">
      <span class="logo-text">Ticketing</span>
    </div>

    <div class="navbar-right">

      <div class="auth-buttons">
        <a href="index.html">Inicio</a>
        <a href="login.html">Iniciar sesión</a>
      </div>

      <div class="profile-icon">
        <i class="fa-solid fa-user"></i>
      </div>

    </div>

  </nav>

  <!-- REGISTER -->
  <main class="login-page">

    <div class="login-card">

      <h1>Crear cuenta</h1>

      <p class="login-subtitle">
        Registrate para reservar y comprar entradas
      </p>

      <form id="clientRegisterForm" class="login-form">

        <input
          type="text"
          name="clientName"
          placeholder="Nombre completo"
          required
        >

        <input
          type="email"
          name="clientEmail"
          placeholder="Correo electrónico"
          required
        >

        <input
          type="password"
          name="clientPassword"
          placeholder="Contraseña"
          required
        >

        <button type="submit" class="login-btn">
          Crear cuenta
        </button>

      </form>

      <p id="clientRegisterMessage" class="login-message"></p>

      <div class="login-footer">
        ¿Ya tenés cuenta?
        <a href="login.html">Iniciar sesión</a>
      </div>

    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
