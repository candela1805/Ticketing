<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Mis Entradas | Ticketing</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="Mis.entradas.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar">

    <div class="logo-container">

      <img src="Ticket.icon.png"
           class="logo-icon">

      <span class="logo-text">
        Ticketing
      </span>

    </div>

    <div class="navbar-right">

      <a href="index.html" id="backHomeBtn">
        Inicio
      </a>

      <a href="carrito.html"
         id="cartBtn">
         Carrito
      </a>

      <div class="profile-wrapper">

        <div class="profile-icon"
             id="profileIcon">

          <i class="fa-solid fa-user"></i>

        </div>

        <div class="profile-dropdown hidden"
             id="profileDropdown">

          <div class="profile-info">

            <p id="profileName"></p>

            <p id="profileEmail"></p>

            <p id="profileRole"></p>

          </div>

          <button id="logoutBtn">
            Cerrar sesión
          </button>

        </div>

      </div>

    </div>

  </nav>

  <!-- CONTENIDO -->

  <main class="container">

    <h2 class="section-title">
      🎟 Mis entradas
    </h2>

    <div id="ticketsList"
         class="tickets-grid">

    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
