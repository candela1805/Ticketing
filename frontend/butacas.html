<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar asientos</title>
  <link rel="stylesheet" href="butacas.css">
</head>
<body>
<nav class="navbar">

  <div
      class="logo-container"
      onclick="window.location.href='index.html'"
      style="cursor:pointer"
    >

      <img
        src="Ticket.icon.png"
        class="logo-icon"
      >

      <span class="logo-text">
        Ticketing
      </span>

    </div>

  <div class="navbar-right">

    <div id="navLinks">

      <a
    href="index.html"
    id="backHomeBtn"
    class="hidden"
    >
      Inicio
    </a>
    
      <a
        href="Mis.entradas.html"
        id="myTicketsBtn"
        class="hidden"
      >
        Mis entradas
      </a>

      <a
        href="carrito.html"
        id="cartBtn"
        class="hidden"
      >
        Carrito
      </a>

    </div>

</nav>

  <header class="header">
    <h1>Seleccionar asientos</h1>
  </header>

  <div class="layout">
    <main class="main">
      <div class="top-info">
        <span id="selectedEventText" class="event-title">Evento</span>

        <div class="legend-inline">
          <div><span class="box available"></span> Disponible</div>
          <div><span class="box reserved"></span> Reservado</div>
          <div><span class="box sold"></span> Vendido</div>
          <div><span class="box selected"></span> Seleccionado</div>
        </div>
      </div>

      <div class="stage" aria-label="Escenario"></div>
      <div id="seatsGrid" class="seats-grid"></div>

      <div class="selection">
        <p id="selectedSeatsText">Butacas seleccionadas: Ninguna</p>
        <button id="confirmBtn" type="button">Confirmar selección</button>
      </div>
    </main>
  </div>

<div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
