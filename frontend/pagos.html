<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pago - Ticketing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="pagos.css">
</head>
<body>

    <div class="payment-container">
        <h2><i class="fas fa-lock"></i> Finalizar Pago</h2>
        
        <div id="paymentSummary">
            <!-- Dinámico: Nombre del evento y butaca -->
        </div>

        <form id="paymentForm">
            <div id="ticketHolders" class="ticket-holders">
                <!-- Dinámico: titulares por entrada -->
            </div>

            <div class="form-group">
                <label for="methodSelector">Método de pago:</label>
                <select id="methodSelector">
                    <option value="Tarjeta">Tarjeta de Crédito/Débito</option>
                    <option value="QR">Pago con QR</option>
                    <option value="Efectivo">Efectivo (Rapipago)</option>
                </select>
            </div>

            <div id="methodDetails">
                <!-- Dinámico: Inputs de tarjeta, Alias o Código -->
            </div>

            <button type="submit" id="confirmPaymentBtn">
                Confirmar Pago de <span id="totalBtn">$0</span>
            </button>
        </form>
        
        <div class="cancel-link">
            <a href="index.html">Cancelar y volver al carrito</a>
        </div>
    </div>

    <!-- Comprobante -->
<div id="receiptModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <div id="receiptPreview"></div>
        <div class="modal-actions">
            <button id="printBtn" class="btn-print">Imprimir entradas</button>
            <button id="downloadBtn" class="btn-download">Descargar HTML</button>
            <button id="closeModalBtn" class="btn-close">Cerrar y Finalizar</button>
        </div>
    </div>
</div>

    <script src="app.js"></script>
</body>
</html>
