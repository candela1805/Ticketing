<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Carrito | Ticketing</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="carrito.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar">

    <div class="logo-container">

      <img src="Ticket.icon.png"
           class="logo-icon">

      <span class="logo-text">
        Ticketing
      </span>

    </div>

    <div class="navbar-right">

      <a href="index.html" id="backHomeBtn">
        Inicio
      </a>

      <a href="Mis.entradas.html"
         id="myTicketsBtn">
         Mis entradas
      </a>

      <div class="profile-wrapper">

        <div class="profile-icon"
             id="profileIcon">

          <i class="fa-solid fa-user"></i>

        </div>

        <div class="profile-dropdown hidden"
             id="profileDropdown">

          <div class="profile-info">

            <p id="profileName"></p>

            <p id="profileEmail"></p>

            <p id="profileRole"></p>

          </div>

          <button id="logoutBtn">
            Cerrar sesión
          </button>

        </div>

      </div>

    </div>

  </nav>

  <!-- CONTENIDO -->

  <main class="container">

    <h2 class="section-title">
      🛒 Carrito
    </h2>

<div id="cartSummary" class="cart-header-container">
  <div class="total-display">
    <span class="total-label">Total:</span>
    <span id="cartTotalText">$0</span>
  </div>
  
  <div class="divider-vertical"></div>

  <button id="payAllBtn" class="pay-all-btn">
    <i class="fa-solid fa-lock"></i> Pagar todo
  </button>
</div>

    <div id="cartItems"
         class="tickets-grid">

    </div>

<div id="cartFooterContainer"></div>

  </main>

  <script src="app.js"></script>

</body>
</html>
